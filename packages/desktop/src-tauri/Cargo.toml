[package]
name = "cordishub-desktop"
version = "0.11.0"
description = "CordisHub Desktop — Tauri 2 shell over the JSON-RPC kernel bridge"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "cordishub-desktop"
path = "src/main.rs"
